# Minimal 2-node back-to-back cEOS topology.
#
# Purpose: confirm Docker + Containerlab + the imported cEOS image all
# actually work together before building anything bigger. Deploy with:
#   ./scripts/02-deploy-lab.sh
#
# The image is `ceos:latest`, not a pinned version, on purpose: everyone
# downloads their own cEOS build from Arista, so the exact version differs
# per person. 01-import-ceos.sh tags whatever you import as BOTH
# ceos:<version> and ceos:latest, so this file works regardless of which
# release you have — `docker images` still shows the real version.
#
# To pin a specific build instead, put ceos:<version> here; 02-deploy-lab.sh
# checks the image exists locally before deploying either way.

name: testlab

topology:
  kinds:
    ceos:
      image: ceos:latest
  nodes:
    spine1:
      kind: ceos
    spine2:
      kind: ceos

  links:
    - endpoints: ["spine1:eth1", "spine2:eth1"]

# Once this comes up clean (both nodes 'running', LLDP sees each other on
# Et1), a natural next step matching the ring/ISP-style topology from the
# team's design notes is 5 backbone routers + 1 edge router, with a shared
# multi-access segment (via a `bridge` kind node, since containerlab has no
# native "unmanaged switch") plus point-to-point ring links for the OSPF
# underlay. Copy this file, rename it, and expand from there.
